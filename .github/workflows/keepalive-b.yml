# Second copy of keepalive.yml on a schedule offset by 2 minutes: two
# independently delayed schedules halve the median silence. Keep the job in
# sync with keepalive.yml; the reason for two files is the schedule alone.
name: keepalive-b
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Fails loudly: a ping that lands on the wrong host would keep nothing awake.
      - run: |
          set -o pipefail
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then sleep 240; fi
            curl -sSf --max-time 120 "${{ vars.VITE_API_URL }}/health" | cut -c1-60
          done
