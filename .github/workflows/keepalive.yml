# Render Free sleeps after 15 minutes without traffic; the collector inside the
# API must not. */5 rather than */10 — GitHub's schedule runs minutes late.
# GitHub disables schedules after 60 days without commits: re-enable in Actions.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sSf --max-time 120 "${{ vars.VITE_API_URL }}/health" | cut -c1-60
